name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview>=4.0
        pip install requests>=2.28
        pip install quickjs>=1.19
        pip install pyinstaller>=5.0
        pip install pystray>=0.19
        pip install Pillow>=9.0
        pip install clipboard>=0.0.4
        pip install pywin32>=305
        pip install pythonnet>=3.0

    - name: Install optional dependencies (JAR source support)
      continue-on-error: true
      run: |
        pip install JPype1>=1.5.0
        pip install enjarify-adapter>=1.0.0

    - name: Verify dependencies
      run: |
        python -c "import webview; print('pywebview OK')"
        python -c "import requests; print('requests OK')"
        python -c "import quickjs; print('quickjs OK')"
        python -c "import pystray; print('pystray OK')"
        python -c "import PIL; print('Pillow OK')"
        python -c "import clipboard; print('clipboard OK')"
        python -c "import win32api; print('pywin32 OK')"
        python -c "import clr; print('pythonnet OK')"
        python -c "import jpype; print('JPype1 OK')" 2>$null
        python -c "import enjarify; print('enjarify OK')" 2>$null

    - name: Verify all project modules import
      run: |
        python -c "from config import Config; print('config OK')"
        python -c "from spider import SpiderManager; print('spider OK')"
        python -c "from jar_spider import is_jar_support_available; print('jar_spider OK')"
        python -c "from live import LiveParser; print('live OK')"
        python -c "from proxy import ProxyServer; print('proxy OK')"
        python -c "from database import Database; print('database OK')"
        python -c "from parser import ParseEngine; print('parser OK')"
        python -c "from epg import EpgParser; print('epg OK')"
        python -c "from sniffer import Sniffer; print('sniffer OK')"
        python -c "from downloader import DownloadManager; print('downloader OK')"
        python -c "from tray import SystemTray; print('tray OK')"
        python -c "from network import HttpClient; print('network OK')"
        python -c "from remote import RemoteServer; print('remote OK')"

    - name: Generate icon if missing
      run: |
        if (-not (Test-Path "static\icon.ico")) {
          python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (0,0,0,0)); d = ImageDraw.Draw(img); d.rounded_rectangle([26,26,230,230], radius=51, fill=(24,144,255,255)); d.polygon([(96,96),(96,160),(160,128)], fill=(255,255,255,255)); img.save('static/icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]); img.save('static/icon.png')"
        }

    - name: Build EXE with PyInstaller
      run: pyinstaller build.spec --noconfirm

    - name: Set up JDK 11 (for jlink)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Create minimal JRE with jlink
      run: |
        $jlinkPath = "$env:JAVA_HOME\bin\jlink.exe"
        Write-Host "Using jlink: $jlinkPath"

        # 创建精简 JRE (~30MB), 包含 JAR Spider 所需的全部模块
        & $jlinkPath `
          --module-path "$env:JAVA_HOME\jmods" `
          --add-modules java.base,java.xml,java.desktop,java.logging,java.management,java.naming,java.net.http,jdk.httpserver `
          --output jre `
          --strip-debug `
          --no-header-files `
          --no-man-pages `
          --compress=2

        Write-Host "=== JRE created ==="
        $jreSize = (Get-ChildItem -Recurse jre | Measure-Object -Property Length -Sum).Sum
        $jreMB = [math]::Round($jreSize / 1MB, 2)
        Write-Host "Minimal JRE Size: $jreMB MB"

    - name: Package zero-dependency bundle (EXE + JRE)
      run: |
        New-Item -ItemType Directory -Force -Path release\TVBoxDesktop
        Copy-Item dist\TVBoxDesktop.exe release\TVBoxDesktop\
        Copy-Item -Recurse jre release\TVBoxDesktop\jre
        Compress-Archive -Path release\TVBoxDesktop\* -DestinationPath release\TVBoxDesktop-zero-dep.zip -Force

        $zipSize = (Get-Item "release\TVBoxDesktop-zero-dep.zip").Length
        $zipMB = [math]::Round($zipSize / 1MB, 2)
        Write-Host "Zero-dependency bundle: $zipMB MB"

    - name: Upload zero-dependency bundle
      uses: actions/upload-artifact@v4
      with:
        name: TVBoxDesktop-ZeroDep
        path: release/TVBoxDesktop-zero-dep.zip
        if-no-files-found: error

    - name: Upload standalone EXE (no JRE)
      uses: actions/upload-artifact@v4
      with:
        name: TVBoxDesktop-Standalone
        path: dist/TVBoxDesktop.exe
        if-no-files-found: error

    - name: Show build info
      run: |
        Write-Host "=== Build Complete ==="
        $exeSize = (Get-Item "dist\TVBoxDesktop.exe").Length
        $exeMB = [math]::Round($exeSize / 1MB, 2)
        Write-Host "Standalone EXE: $exeMB MB"
        $jreSize = (Get-ChildItem -Recurse jre | Measure-Object -Property Length -Sum).Sum
        $jreMB = [math]::Round($jreSize / 1MB, 2)
        Write-Host "Minimal JRE: $jreMB MB"
        $zipSize = (Get-Item "release\TVBoxDesktop-zero-dep.zip").Length
        $zipMB = [math]::Round($zipSize / 1MB, 2)
        Write-Host "Zero-dep bundle: $zipMB MB"
